name: Build AI Studio Web App to APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Java JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Web-Ordner vorbereiten & Capacitor ausführen
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          
          # Alle Projektdateien sauber in den www-Ordner kopieren
          mkdir -p www
          rsync -av --exclude='www' --exclude='android' --exclude='.git' --exclude='.github' ./ www/

          # Capacitor installieren & konfigurieren
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "AI Studio App" "com.aistudio.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: APK bauen
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: aistudio-app-apk
          path: "android/app/build/outputs/apk/debug/*.apk"
          
