name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Java JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Repositories & Plugin-Pfade reparieren
        run: |
          # 1. Projektname säubern und Repositories festlegen
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DienstplanApp"
          include(":app")
          EOF

          # 2. Ungültige AGP-Version (9.1.1) auf 8.2.2 erzwingen (egal ob doppelte oder einfache Anführungszeichen)
          sed -i -E 's/id\s*\("com\.android\.application"\)\s*version\s*"[^"]+"/id("com.android.application") version "8.2.2"/g' app/build.gradle.kts || true
          sed -i -E "s/id\s*\('com\.android\.application'\)\s*version\s*'[^']+'/id('com.android.application') version '8.2.2'/g" app/build.gradle.kts || true
          
          # Alle weiteren Fundstellen von 9.1.1 in allen build.gradle(.kts) Dateien ersetzen
          find . -name "build.gradle*" -exec sed -i 's/9\.1\.1/8\.2\.2/g' {} +

      - name: Gradle Setup (ohne Caching)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Build ausführen
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: "**/build/outputs/apk/**/*.apk"
