      - name: Repositories & Plugin-Pfade reparieren
        run: |
          # 1. Projektname säubern und Repositories festlegen
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DienstplanApp"
          include(":app")
          EOF

          # 2. Ungültige AGP-Version (9.1.1 oder andere) auf 8.2.2 erzwingen
          sed -i -E 's/id\s*\("com\.android\.application"\)\s*version\s*"[^"]+"/id("com.android.application") version "8.2.2"/g' app/build.gradle.kts
          sed -i -E "s/id\s*\('com\.android\.application'\)\s*version\s*'[^']+'/id('com.android.application') version '8.2.2'/g" app/build.gradle.kts
          
          # Falls plugins in der Haupt-build.gradle.kts liegen:
          find . -maxdepth 2 -name "build.gradle*" -exec sed -i -E 's/version\s*"\s*9\.1\.1\s*"/version "8.2.2"/g' {} +
