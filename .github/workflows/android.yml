Name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Java JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Repositories & Plugin-Pfade reparieren
        run: |
          # 1. Projektname säubern und Repositories festlegen
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DienstplanApp"
          include(":app")
          EOF

          # 2. Ungültige Version 9.1.1 in build.gradle.kts auf 8.2.2 korrigieren
          find . -name "build.gradle.kts" -exec sed -i 's/9\.1\.1/8\.2\.2/g' {} +
          find . -name "build.gradle" -exec sed -i 's/9\.1\.1/8\.2\.2/g' {} +

      - name: Cache säubern und Gradle Setup
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build ausführen
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --no-configuration-cache --refresh-dependencies --stacktrace

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: "**/build/outputs/apk/**/*.apk"
