name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Java JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle 8.2 & Build ausführen
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Repositories vorbereiten & APK bauen
        run: |
          # Erstelle eine temporäre settings.gradle.kts mit Plugin-Repositories falls nötig
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.2
          fi
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: "**/build/outputs/apk/**/*.apk"
          
